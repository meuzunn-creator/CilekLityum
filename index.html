<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Çilek Lityum BMS SCADA v1.0</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="logo">

🔋 ÇİLEK LİTYUM BMS SCADA

</div>

<div id="connection" class="online">

<i class="fa-solid fa-circle"></i>

ONLINE

</div>

</header>

<div class="layout">

<!-- SOL MENÜ -->

<aside class="sidebar">

<h3>SİSTEM</h3>

<button class="menu active">

<i class="fa-solid fa-gauge-high"></i>

Dashboard

</button>

<button class="menu">

<i class="fa-solid fa-car-battery"></i>

Aküler

</button>

<button class="menu">

<i class="fa-solid fa-chart-line"></i>

Trendler

</button>

<button class="menu">

<i class="fa-solid fa-bell"></i>

Alarmlar

</button>

<button class="menu">

<i class="fa-solid fa-gear"></i>

Ayarlar

</button>

</aside>

<!-- ANA İÇERİK -->

<main class="content">

<!-- BATARYA PANELİ -->

<div class="batteryPanel">

<div class="batteryHeader">

<div>

<h2>Batarya Durumu</h2>

<p id="deviceName">-</p>

</div>

<div id="stateBadge" class="stateBadge">

<span id="state">-</span>

</div>

</div>

<div class="batteryBody">

<div class="batteryGraphic">

<div class="battery">

<div id="batteryLevel" class="batteryLevel"></div>

</div>

<div id="socText">

0%

</div>

</div>

<div class="batteryInfo">

<div class="infoBox">

<span>SOC</span>

<strong id="soc">0%</strong>

</div>

<div class="infoBox">

<span>SOH</span>

<strong id="soh">0%</strong>

</div>

<div class="infoBox">

<span>Voltaj</span>

<strong id="volt">0 V</strong>

</div>

<div class="infoBox">

<span>Akım</span>

<strong id="current">0 A</strong>

</div>

<div class="infoBox">

<span>Sıcaklık</span>

<strong id="temp">0 °C</strong>

</div>

<div class="infoBox">

<span>Hücre</span>

<strong id="cells">0</strong>

</div>

</div>

</div>

</div>

<!-- HEATMAP -->

<div class="placeholderCard">

<h2>

<i class="fa-solid fa-border-all"></i>

Hücre Heatmap

</h2>

<div id="heatmap" class="heatmap"></div>

</div>

<!-- GRAFİK -->

<div class="chartCard">

<h2>

<i class="fa-solid fa-chart-column"></i>

Hücre Voltaj Grafiği

</h2>

<div class="chartContainer">
    <canvas id="voltageChart"></canvas>
</div>

</div>

<!-- SICAKLIK -->

<div class="placeholderCard">

<h2>

<i class="fa-solid fa-temperature-half"></i>

Sıcaklık Grafiği

</h2>

<div>

v1.0.3 sürümünde eklenecek.

</div>

</div>

<!-- ALARM -->

<div class="alarmCard">

<h2>

<i class="fa-solid fa-triangle-exclamation"></i>

Alarm Durumu

</h2>

<div id="alarm">

🟢 Alarm Yok

</div>

</div>

<!-- FOOTER -->

<div class="footerCard">

Son Güncelleme

<div id="time">

-

</div>

</div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="app.js"></script>

</body>

</html>
